<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- 瀬織津姫: a faceted crystal (purification) rising out of rapids -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1440"/>
      <stop offset="1" stop-color="#0b1a33"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)" fill-opacity="0.9"/>
  <circle cx="64" cy="58" r="44" fill="url(#glow)"/>

  <!-- crystal facets -->
  <g stroke="#1a1440" stroke-width="0.8" stroke-linejoin="round">
    <path d="M66 18 L45 40 L61 57 Z" fill="#ddd0ff"/>
    <path d="M66 18 L88 43 L61 57 Z" fill="#a98bff"/>
    <path d="M45 40 L39 80 L61 57 Z" fill="#8a5cf6"/>
    <path d="M88 43 L84 86 L61 57 Z" fill="#6d3fd8"/>
    <path d="M39 80 L64 80 L61 57 Z" fill="#7a6cf5"/>
    <path d="M84 86 L64 80 L61 57 Z" fill="#4f46c8"/>
    <path d="M39 80 L60 104 L64 80 Z" fill="#5b8cf6"/>
    <path d="M84 86 L60 104 L64 80 Z" fill="#3b5fd0"/>
  </g>
  <path d="M66 18 L45 40 L39 80 L60 104 L84 86 L88 43 Z" fill="none" stroke="#ede9fe" stroke-opacity="0.5" stroke-width="1.2" stroke-linejoin="round"/>

  <!-- rapids -->
  <path d="M16 92 C38 78 54 108 78 94 S104 78 114 82" fill="none" stroke="url(#water)" stroke-width="6" stroke-linecap="round"/>
  <path d="M22 104 C42 94 60 116 82 106 S104 94 110 96" fill="none" stroke="url(#water)" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>

  <!-- sparkle -->
  <path d="M98 22 Q99.5 29 106 30 Q99.5 31 98 38 Q96.5 31 90 30 Q96.5 29 98 22 Z" fill="#f5f3ff"/>
  <circle cx="30" cy="34" r="1.6" fill="#c4b5fd"/>

  <rect x="8" y="8" width="112" height="112" rx="26" fill="none" stroke="url(#rim)" stroke-width="2.5" stroke-opacity="0.8"/>
</svg>
